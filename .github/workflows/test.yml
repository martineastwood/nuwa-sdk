name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Nim tests on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: Linux x86_64, os: ubuntu-latest}
          - {label: Linux ARM64, os: ubuntu-24.04-arm}
          - {label: macOS ARM64, os: macos-14}
          - {label: macOS Intel, os: macos-15-intel}
          - {label: Windows x86_64, os: windows-latest}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - run: python -m pip install numpy
      - uses: ./.github/actions/setup-nim

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .nimble
          key: ${{ runner.os }}-${{ runner.arch }}-nim-2.2.10-${{ hashFiles('nuwa_sdk.nimble') }}

      - name: Install pinned Nim dependencies
        run: nimble install nimpy@0.2.1 -y

      - name: Run tests
        run: nimble test
