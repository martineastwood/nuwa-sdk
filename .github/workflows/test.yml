# Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Nim tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NumPy
        run: python -m pip install --upgrade pip numpy

      - name: Install Nim (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl https://nim-lang.org/choosenim/init.sh -sSf > init.sh
          sh init.sh -y
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Install Nim (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install nim
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Install Nim (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nim --version 2.2.10 -y
          echo "C:\tools\Nim\nim-2.2.10\bin" >> "$GITHUB_PATH"
          echo "C:\Users\runneradmin\.nimble\bin" >> "$GITHUB_PATH"

      - name: Verify Nim
        run: nim --version

      - name: Install nimpy
        run: nimble install nimpy -y

      - name: Run tests
        run: nimble test
